<mat-card appearance="outlined">

  <mat-card-header>
    <mat-card-title>{{ name ?? 'Unnamed tech demo' }}</mat-card-title>
    <mat-card-subtitle>
      <mat-chip>{{ genre }}</mat-chip>
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p>{{ description }}</p>
  </mat-card-content>

  <mat-card-actions>
    <button matButton="elevated" [disabled]="!canView">View</button>
  </mat-card-actions>

</mat-card>
